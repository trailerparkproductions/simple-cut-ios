name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project SimpleCut.xcodeproj \
            -scheme SimpleCut \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SimpleCut.app Payload/
          zip -r SimpleCut.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleCut-ipa
          path: SimpleCut.ipa
